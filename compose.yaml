# Illustrative example of how the `axgit` image slots into the git-compose stack
# (https://git.ptcookie.net/git-compose.git) as a replacement for its `git-web` service
# (Cgit + Nginx + fcgiwrap). This file is NOT wired into any deploy process here — it exists to
# show the shape of the change. The actual git-compose.git service definition is tracked and
# changed in that separate repository.
#
# Assumes a `git-repository` named volume already populated by the git-server container (the
# same volume `git-web` used to mount) and an external reverse proxy handling TLS termination
# (docs/DECISIONS.md #10) that forwards to this service's 8080.

services:
  git-web:
    image: axgit:latest
    # build: https://git.ptcookie.net/axgit.git for a from-source build instead of a
    # pre-built image; see README.md#deployment for the equivalent `docker build` invocation.
    restart: unless-stopped
    read_only: true
    volumes:
      # Read-only: axgit never writes to a repository (CLAUDE.md's core invariant). Push is
      # SSH-only, handled entirely by the git-server container.
      - git-repository:/srv/git:ro
      # Optional: the TOML config file (docs/DECISIONS.md #87), an alternative to the
      # `environment:` block below — axgit reads /etc/axgit/axgit.toml by itself when it
      # exists. See this repository's own axgit.toml for every key.
      #
      # Caveat specific to the container: an environment variable always beats the file, but
      # this image sets no ENV of its own (docs/DECISIONS.md #88 — the frontend is baked into
      # the binary, so there's no AXGIT_STATIC_DIR to pin), so every setting is the file's to
      # set, as long as it isn't also spelled out under `environment:` below. Note that
      # setting `listen` in the file means updating `expose:`, the healthcheck and any
      # published port to match.
      # - ./axgit.toml:/etc/axgit/axgit.toml:ro
    environment:
      # Base URL shown for `git clone` in the repository summary page.
      AXGIT_CLONE_URL_BASE: https://git.example.com
      # Defaults shown for reference — uncomment to override. Deliberately left commented
      # rather than spelled out: an environment variable beats the config file, so restating
      # a default here would quietly stop a mounted axgit.toml from setting it.
      # AXGIT_REPO_ROOT: /srv/git
      # AXGIT_LISTEN: 0.0.0.0:8080
      # AXGIT_CACHE_SCAN_TTL: "60"
      # AXGIT_CACHE_RESPONSE_TTL: "300"
      # AXGIT_CACHE_RESPONSE_MAX_BYTES: "33554432"
      # AXGIT_REPOSITORY_SORT: name
      # AXGIT_ROOT_TITLE: PtCookie Git
      # AXGIT_ROOT_DESC: Self-hosted repositories
      # AXGIT_ROOT_README: /srv/git/README.md
      # AXGIT_LOGO: /srv/git/logo.svg
      # AXGIT_LOGO_LINK: https://example.com
      # AXGIT_FAVICON: /srv/git/favicon.svg
    expose:
      - "8080"
    healthcheck:
      # Also declared in the image itself (Containerfile); repeated here only if the compose
      # file's own health-based `depends_on` ordering is needed elsewhere in the stack.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/repos"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      # Matches ARCHITECTURE.md's "logs go to stdout/stderr as JSON, collected by fluentd" note.
      driver: fluentd

volumes:
  git-repository:
    external: true
