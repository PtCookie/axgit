# Single-binary release tarballs on a `v*` tag (scripts/make-release.sh,
# docs/DECISIONS.md #75/#76/#79/#92).
#
# One job per architecture, each building *natively*: x86_64 on the standard
# runner, aarch64 on `ubuntu-24.04-arm`. That replaces the cross-compilation
# the old pipeline needed (an aarch64 cross musl gcc plus the CC_/AR_/LINKER_
# environment dance in make-release.sh, docs/DECISIONS.md #79) with a single
# `musl-tools` install on each side, and it means the script's smoke check —
# the only thing that ever executes the binary before it ships — always runs
# instead of being skipped for the foreign target (#76's caveat).
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release that is already producing artifacts.
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing shouldn't hide whether the other builds.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      # make-release.sh builds the frontend but deliberately does not install
      # JS dependencies, so that has to happen here first.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          key: ${{ matrix.target }}
      # Provides this runner's own `musl-gcc`, which is the first candidate
      # make-release.sh looks for on a native target. libgit2-sys, libz-sys,
      # liblzma-sys and zstd-sys all compile vendored C sources through it.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      # TAG_NAME makes the script assert the pushed tag matches
      # api/Cargo.toml's version *before* building, so a skewed tag stops the
      # release instead of shipping a mislabelled tarball (docs/DECISIONS.md #75).
      - name: Build release tarball
        env:
          TARGET: ${{ matrix.target }}
          TAG_NAME: ${{ github.ref_name }}
        run: ./scripts/make-release.sh
      # Tarballs only. The script also writes a SHA256SUMS, but it covers just
      # this one target — the checksum file that ships is built in `publish`
      # below, over every tarball the matrix produced.
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # The only write this workflow does, and it targets the release, not the
      # git history — safe on a mirror, unlike a commit.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true
          path: release
      # Rebuilt here rather than reused from a build job: make-release.sh's
      # contract is that SHA256SUMS covers every tarball produced, and only
      # this job sees all of them (docs/DECISIONS.md #92).
      - name: Write checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          fail_on_unmatched_files: true
