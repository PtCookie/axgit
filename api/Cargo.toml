[package]
name = "axgit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
# Inflating gzip-compressed Smart HTTP request bodies.
flate2 = "1"
# Read-only access to local bare repositories — no ssh/https transports needed.
git2 = { version = "0.20", default-features = false }
jiff = "0.2"
mime_guess = "2"
# Response cache keyed by (repo, endpoint, params) — docs/ARCHITECTURE.md#caching.
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# Building gzip-compressed Smart HTTP request bodies in tests.
flate2 = "1"
http-body-util = "0.1"
# Atom feed well-formedness checks in tests only — production XML is built by hand.
quick-xml = "0.37"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
