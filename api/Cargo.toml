[package]
name = "axgit"
version = "0.4.1"
edition = "2024"

[dependencies]
anyhow = "1"
# git archive itself only emits tar / tar.gz / zip; .tar.bz2, .tar.xz and
# .tar.zst are produced by wrapping its `--format=tar` stdout in an
# in-process streaming encoder (docs/DECISIONS.md #54).
async-compression = { version = "0.4", features = ["tokio", "bzip2", "xz", "zstd"] }
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
# Inflating gzip-compressed Smart HTTP request bodies.
flate2 = "1"
# Read-only access to local bare repositories — no ssh/https transports needed.
git2 = { version = "0.20", default-features = false }
jiff = "0.2"
# Not called directly. `liblzma-sys` (pulled in by async-compression's `xz`
# feature) otherwise pkg-config-probes for a system liblzma and links it
# dynamically when one happens to be installed (e.g. Homebrew's xz on macOS),
# making the link line depend on the build host; `static` always builds the
# vendored xz C source with `cc`, the same posture as libgit2-sys's vendored
# build (docs/DECISIONS.md #54).
liblzma = { version = "0.4", features = ["static"] }
mime_guess = "2"
# Response cache keyed by (repo, endpoint, params) — docs/ARCHITECTURE.md#caching.
moka = { version = "0.12", features = ["future"] }
# Decoding request paths against the embedded `web/dist` copy
# (`embed-web` feature, docs/DECISIONS.md #74) — already in the dependency
# graph transitively (axum/tower-http), pulled in directly here too.
percent-encoding = "2"
# Bakes `web/dist` into the binary for the `embed-web` feature (the
# single-binary deploy path, docs/DECISIONS.md #74). `debug-embed` embeds in
# debug builds too, so `cargo test --features embed-web` exercises the same
# code path as release; `mime-guess` reuses the same `mime_guess` crate
# already used for file content types elsewhere, so embedded and
# `AXGIT_STATIC_DIR` serving agree; `deterministic-timestamps` keeps the
# compiled binary reproducible across checkouts (the embedded timestamps
# themselves are never read by this crate).
rust-embed = { version = "8.12", features = ["debug-embed", "mime-guess", "deterministic-timestamps"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
# Parses the optional TOML config file (docs/DECISIONS.md #87). Read-only:
# axgit never writes TOML back, so the `display` (serializer) and
# `preserve_order` features stay off — `parse` + `serde` + `std` is the whole
# surface used.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["preserve_order"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }

[features]
# Bakes `web/dist` into the binary — the single-binary, non-container deploy
# path (docs/DECISIONS.md #74). Requires `pnpm --filter web build` to have
# produced `web/dist` before this feature is built; the default build has no
# compile-time dependency on it. `AXGIT_STATIC_DIR` still overrides at
# runtime when set.
embed-web = ["dep:rust-embed"]

[dev-dependencies]
# Decompressing the archive endpoint's bzip2/xz/zstd output in tests, without
# depending on those binaries being installed on the test host (docs/API.md's
# archive section, docs/DECISIONS.md #54).
async-compression = { version = "0.4", features = ["tokio", "bzip2", "xz", "zstd"] }
# Building gzip-compressed Smart HTTP request bodies in tests.
flate2 = "1"
http-body-util = "0.1"
# Atom feed well-formedness checks in tests only — production XML is built by hand.
quick-xml = "0.37"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
